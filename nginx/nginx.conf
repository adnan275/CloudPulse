worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream backend_cluster {
        server 127.0.0.1:3001 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:3002 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name app.team1.test api.team1.test;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name app.team1.test api.team1.test;

        ssl_certificate      /etc/nginx/certs/app.team1.test.crt;
        ssl_certificate_key  /etc/nginx/certs/app.team1.test.key;

        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://backend_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Upstream-Node $upstream_addr always;
        }
    }
}
